<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Classic Snake Game</title>
  <style>
    body {
      margin: 0;
      background: #0b1528;
      color: #fff;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      touch-action: none;
    }
    #score-board {
      font-size: 18px;
      margin-bottom: 10px;
      color: #4ade80;
    }
    canvas {
      border: 2px solid #1e293b;
      background: #020617;
      border-radius: 8px;
    }
    .controls {
      margin-top: 15px;
      display: grid;
      grid-template-columns: repeat(3, 60px);
      grid-gap: 8px;
    }
    .btn {
      width: 60px;
      height: 60px;
      background: #1e293b;
      border: 1px solid #334155;
      color: #fff;
      font-size: 20px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
    .btn:active {
      background: #3b82f6;
    }
    #up { grid-column: 2; }
    #left { grid-column: 1; grid-row: 2; }
    #down { grid-column: 2; grid-row: 2; }
    #right { grid-column: 3; grid-row: 2; }
  </style>
</head>
<body>

  <div id="score-board">🍎 SKOR: <span id="score">0</span></div>
  <canvas id="game" width="300" height="300"></canvas>

  <div class="controls">
    <div class="btn" id="up" onclick="setDir(0, -1)">⬆️</div>
    <div class="btn" id="left" onclick="setDir(-1, 0)">⬅️</div>
    <div class="btn" id="down" onclick="setDir(0, 1)">⬇️</div>
    <div class="btn" id="right" onclick="setDir(1, 0)">➡️</div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const grid = 15;
    let snake = [{x: 150, y: 150}, {x: 135, y: 150}, {x: 120, y: 150}];
    let dx = grid, dy = 0;
    let food = {x: 60, y: 60};
    let score = 0;
    let gameInterval;

    function setDir(x, y) {
      if ((x === 1 && dx === -grid) || (x === -1 && dx === grid)) return;
      if ((y === 1 && dy === -grid) || (y === -1 && dy === grid)) return;
      dx = x * grid;
      dy = y * grid;
    }

    function move() {
      const head = {x: snake[0].x + dx, y: snake[0].y + dy};

      // Tabrakan Dinding
      if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
        return reset();
      }

      // Tabrakan Badan
      for (let segment of snake) {
        if (head.x === segment.x && head.y === segment.y) return reset();
      }

      snake.unshift(head);

      // Makan
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        document.getElementById('score').innerText = score;
        food = {
          x: Math.floor(Math.random() * (canvas.width / grid)) * grid,
          y: Math.floor(Math.random() * (canvas.height / grid)) * grid
        };
      } else {
        snake.pop();
      }

      // Render
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(food.x, food.y, grid - 1, grid - 1);

      snake.forEach((seg, i) => {
        ctx.fillStyle = i === 0 ? '#22c55e' : '#15803d';
        ctx.fillRect(seg.x, seg.y, grid - 1, grid - 1);
      });
    }

    function reset() {
      alert('Game Over! Skor kamu: ' + score);
      score = 0;
      document.getElementById('score').innerText = 0;
      snake = [{x: 150, y: 150}, {x: 135, y: 150}, {x: 120, y: 150}];
      dx = grid; dy = 0;
    }

    gameInterval = setInterval(move, 120);
  </script>
</body>
</html>
