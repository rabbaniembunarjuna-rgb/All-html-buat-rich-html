<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Snake Game</title>
  <style>
    * { box-sizing: border-box; touch-action: none; user-select: none; }
    body {
      margin: 0;
      background: #0b1329;
      color: #fff;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    #score-box {
      font-size: 16px;
      font-weight: bold;
      color: #4ade80;
      margin-bottom: 8px;
    }
    canvas {
      background: #020617;
      border: 2px solid #1e293b;
      border-radius: 10px;
    }
    .d-pad {
      margin-top: 15px;
      display: grid;
      grid-template-columns: repeat(3, 65px);
      grid-gap: 10px;
    }
    .btn {
      width: 65px;
      height: 65px;
      background: #0f172a;
      border: 1px solid #334155;
      color: #38bdf8;
      font-size: 24px;
      font-weight: bold;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn:active { background: #1e293b; color: #fff; }
    #up { grid-column: 2; }
    #left { grid-column: 1; grid-row: 2; }
    #down { grid-column: 2; grid-row: 2; }
    #right { grid-column: 3; grid-row: 2; }
  </style>
</head>
<body>

  <div id="score-box">🍎 SKOR: <span id="score">0</span></div>
  <canvas id="board" width="280" height="280"></canvas>

  <div class="d-pad">
    <div class="btn" id="up" onclick="setDir(0, -1)">⬆️</div>
    <div class="btn" id="left" onclick="setDir(-1, 0)">⬅️</div>
    <div class="btn" id="down" onclick="setDir(0, 1)">⬇️</div>
    <div class="btn" id="right" onclick="setDir(1, 0)">➡️</div>
  </div>

  <script>
    const canvas = document.getElementById('board');
    const ctx = canvas.getContext('2d');
    const box = 20;
    let snake = [{ x: 140, y: 140 }, { x: 120, y: 140 }, { x: 100, y: 140 }];
    let food = { x: 60, y: 60 };
    let dx = box, dy = 0;
    let score = 0;

    function setDir(x, y) {
      if ((x === 1 && dx === -box) || (x === -1 && dx === box)) return;
      if ((y === 1 && dy === -box) || (y === -1 && dy === box)) return;
      dx = x * box;
      dy = y * box;
    }

    function gameLoop() {
      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      // Tabrak dinding atau badan sendiri
      if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height ||
          snake.some(seg => seg.x === head.x && seg.y === head.y)) {
        alert('💀 GAME OVER! Skor akhir: ' + score);
        snake = [{ x: 140, y: 140 }, { x: 120, y: 140 }, { x: 100, y: 140 }];
        dx = box; dy = 0;
        score = 0;
        document.getElementById('score').innerText = 0;
        return;
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        document.getElementById('score').innerText = score;
        food = {
          x: Math.floor(Math.random() * (canvas.width / box)) * box,
          y: Math.floor(Math.random() * (canvas.height / box)) * box
        };
      } else {
        snake.pop();
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(food.x, food.y, box - 2, box - 2);

      snake.forEach((seg, i) => {
        ctx.fillStyle = i === 0 ? '#22c55e' : '#15803d';
        ctx.fillRect(seg.x, seg.y, box - 2, box - 2);
      });
    }

    setInterval(gameLoop, 130);
  </script>
</body>
</html>
